title: LAPS Parola Özniteliği Okuma / Yetkisiz Erişim
id: 9a0b1c2d-3456-789a-bcde-lapsharvest01
status: production
description: Active Directory üzerinde ms-Mcs-AdmPwd veya modern msLAPS-Password özniteliğinin anormal şekilde okunduğunu tespit eder.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: Active Directory Ustalık Programı
date: 2026-10-13
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
      - 'ms-Mcs-AdmPwd'
      - 'msLAPS-Password'
      - 'msLAPS-EncryptedPassword'
  filter_authorized_tier0:
    SubjectUserName|startswith: 'T0-Admin-'
  condition: selection and not filter_authorized_tier0
falsepositives:
  - Yetkili yardım masası veya sistem yöneticisi hesaplarının meşru şifre okumaları
level: medium
tags:
  - attack.credential_access
  - attack.t1552.001
