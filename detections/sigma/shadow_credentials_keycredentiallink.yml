title: Shadow Credentials (msDS-KeyCredentialLink Ekleme)
id: 1f2e3d4c-5678-90ab-cdef-shadowcred01
status: production
description: Bir Active Directory nesnesinin msDS-KeyCredentialLink özniteliğine yeni bir sertifika anahtar bağlamı (Shadow Credentials) eklendiğini tespit eder.
references:
  - https://attack.mitre.org/techniques/T1556/
author: Active Directory Ustalık Programı
date: 2026-10-13
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
    OperationType: '%%14674' # Value Added
  condition: selection
falsepositives:
  - Windows Hello for Business (WHfB) cihaz kayıtları ve kimlik bağlama işlemleri
level: high
tags:
  - attack.credential_access
  - attack.t1556
